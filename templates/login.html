<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Targo Bank // Authentication</title>
    <style>
        :root {
            --bg-base: #060913;
            --glass-card: rgba(13, 20, 38, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glow-cyan: rgba(6, 182, 212, 0.15);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main);
            margin: 0; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.3) 0%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: 1;
            top: -100px;
            left: -100px;
            animation: floating 8s infinite alternate ease-in-out;
        }
        .glow-orb-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(80px);
            z-index: 1;
            bottom: -150px;
            right: -150px;
            animation: floating 12s infinite alternate-reverse ease-in-out;
        }

        @keyframes floating {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .auth-container:hover {
            transform: translateY(-5px);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .shield-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            margin: 0 auto 15px auto;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
            font-weight: bold;
            font-size: 20px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .brand-logo span { color: #38bdf8; }

        .brand-tag {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--border); 
            color: var(--text-main);
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus { 
            outline: none; 
            border-color: var(--border-focus); 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            background: rgba(3, 7, 18, 0.8);
        }

        .btn-action { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn-action:hover { 
            background: linear-gradient(135deg, #0384c7 0%, #0284c7 100%); 
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
            transform: scale(1.01);
        }

        .error-banner { 
            background: rgba(239, 68, 68, 0.1); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px; 
            border-radius: 10px; 
            margin-bottom: 24px; 
            font-size: 13px;
            text-align: center;
        }

        .switch-mode {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .switch-mode a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        
        .switch-mode a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="glow-orb"></div>
<div class="glow-orb-2"></div>

<div class="auth-container">
    <div class="brand-header">
        <div class="shield-icon">✓</div>
        <div class="brand-logo">Targo<span>Bank</span></div>
        <div class="brand-tag">Cryptographic Financial Engine</div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="error-banner">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label>User Name</label>
            <input type="text" name="username" placeholder="Username" required autocomplete="off" autofocus>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>
        
        <button type="submit" class="btn-action">Login</button>
    </form>

    <div class="switch-mode">
        Unprovisioned node? <a href="/register">Initialize New Profile</a>
    </div>
</div>

</body>
</html>
