<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Guard </title>
    <style>
        :root {
            --bg-app: #090d16;
            --bg-card: #111827;
            --border: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #38bdf8;
            --error: #ef4444;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-app); 
            color: var(--text-primary);
            margin: 0; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-box {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin: 0;
            text-transform: uppercase;
        }

        .brand-logo span { color: var(--accent); }

        .brand-tag {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            background: #030712;
            border: 1px solid var(--border); 
            color: var(--text-primary);
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus { 
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 1px var(--accent);
        }

        .btn-action { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-action:hover { background: #0369a1; }

        .error-banner { 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--error); 
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 24px; 
            font-size: 13px;
            text-align: center;
        }

        .switch-mode {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .switch-mode a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        
        .switch-mode a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="brand-box">
    <div class="brand-logo">Vault<span>Guard</span></div>
    <div class="brand-tag">Cryptographic Banking Portal</div>
</div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="error-banner">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label>OPERATOR NAMESPACE</label>
            <input type="text" name="username" placeholder="Username" required autocomplete="off" autofocus>
        </div>
        
        <div class="form-group">
            <label>SECURE ACCESS PASSKEY</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>
        
        <button type="submit" class="btn-action">Establish Secure Session</button>
    </form>

    <div class="switch-mode">
        Unauthorized terminal? <a href="/register">Provision new credentials</a>
    </div>
</div>

</body>
</html>
